[package]
name = "agentssh"
version = "0.1.11"
edition = "2024"
description = "AI-native SSH toolkit — programmable JSON-speaking SSH/SFTP backend for AI agents"
license = "MIT"
repository = "https://github.com/trtyr/AgentSSH"
readme = "README.md"
keywords = ["ssh", "sftp", "ai", "agent", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "6.0.0"
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.0"
ssh2 = "0.9.5"
regex = "1.11.1"
base64 = "0.22"
